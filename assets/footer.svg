<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-label="Connection to youhide closed — always learning, always shipping">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8be9fd"/>
      <stop offset="50%" stop-color="#ff79c6"/>
      <stop offset="100%" stop-color="#bd93f9"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#44475a" opacity="0.5"/>
    </pattern>
    <clipPath id="card">
      <rect width="1200" height="170" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,DejaVu Sans Mono,monospace">
    <rect width="1200" height="170" fill="#282a36"/>
    <rect width="1200" height="170" fill="url(#dots)"/>
    <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

    <text x="600" y="82" text-anchor="middle" font-size="26"><tspan fill="#50fa7b">$</tspan><tspan fill="#f8f8f2" dx="12">exit</tspan><tspan fill="#ff79c6" dx="6">█<animate attributeName="opacity" values="1;1;0;0" dur="1.2s" repeatCount="indefinite"/></tspan></text>

    <text x="600" y="122" text-anchor="middle" font-size="16" fill="#6272a4">Connection to youhide closed. Always learning, always shipping.</text>
  </g>
</svg>
