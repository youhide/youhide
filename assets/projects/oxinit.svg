<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 108" width="1200" height="108" role="img" aria-label="oxinit (Rust) — A service manager and PID 1 for Linux — TOML units, no panic, no async runtime (pre-alpha). 1 stars on GitHub.">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd93f9"/>
      <stop offset="100%" stop-color="#8be9fd"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#44475a" opacity="0.5"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="108" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#card)" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,DejaVu Sans Mono,monospace">
    <rect width="1200" height="108" fill="#282a36"/>
    <rect width="1200" height="108" fill="url(#dots)"/>
    <rect x="0" y="0" width="4" height="108" fill="url(#edge)"/>

    <text x="48" y="52" font-size="19" font-weight="700" fill="#bd93f9">oxinit</text>
    <text x="48" y="74" font-size="13" fill="#6272a4">Rust</text>
    <text x="285" y="48" font-size="15" fill="#f8f8f2">A service manager and PID 1 for Linux — TOML units, no panic, no async runtime</text>
    <text x="285" y="70" font-size="15" fill="#f8f8f2">(pre-alpha)</text>
    <text x="1152" y="59" text-anchor="end" font-size="16" fill="#f1fa8c">★ 1</text>

    <rect x="0.75" y="0.75" width="1198.5" height="106.5" rx="12" fill="none" stroke="#44475a" stroke-width="1.5"/>
  </g>
</svg>
