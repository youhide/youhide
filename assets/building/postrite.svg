<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="PostRite (@Post-Rite) — Engineering order inside the chaos of time-based publishing. Social publishing in one workspace — 12+ networks, campaign calendar, approval workflows with audit trail, per-platform variants, and an MCP server so AI assistants can schedule posts by conversation.">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd93f9"/>
      <stop offset="100%" stop-color="#8be9fd"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#44475a" opacity="0.5"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="150" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#card)" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,DejaVu Sans Mono,monospace">
    <rect width="1200" height="150" fill="#282a36"/>
    <rect width="1200" height="150" fill="url(#dots)"/>
    <rect x="0" y="0" width="4" height="150" fill="url(#edge)"/>

    <image x="48" y="34" width="210" height="52" preserveAspectRatio="xMidYMid meet" href="data:image/png;base64,"/>
    <text x="153" y="114" text-anchor="middle" font-size="13" fill="#6272a4">@Post-Rite</text>
    <text x="285" y="46" font-size="15" font-style="italic" fill="#8be9fd">Engineering order inside the chaos of time-based publishing.</text>
    <text x="285" y="78" font-size="15" fill="#f8f8f2">Social publishing in one workspace — 12+ networks, campaign calendar, approval</text>
    <text x="285" y="100" font-size="15" fill="#f8f8f2">workflows with audit trail, per-platform variants, and an MCP server so AI</text>
    <text x="285" y="122" font-size="15" fill="#f8f8f2">assistants can schedule posts by conversation.</text>

    <rect x="0.75" y="0.75" width="1198.5" height="148.5" rx="12" fill="none" stroke="#44475a" stroke-width="1.5"/>
  </g>
</svg>
