name: Profile

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate cards and refresh counts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/generate_stats.py
          python3 scripts/generate_techstack.py
          python3 scripts/generate_codersrank.py
          python3 scripts/generate_projects.py
          python3 scripts/generate_about.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets
          git commit -m 'Update profile cards'
          git push
