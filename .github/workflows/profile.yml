name: Profile

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate cards and refresh counts
        id: generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Each generator runs on its own: the CodersRank API answers with an
          # empty body often enough that letting one failure abort the step
          # left stats, projects and about un-updated for the whole day.
          failed=""
          for script in generate_stats generate_techstack generate_codersrank \
                        generate_projects generate_detected generate_about; do
            if ! python3 "scripts/$script.py"; then
              echo "::warning::$script failed — its card keeps the previous version"
              failed="$failed $script"
            fi
          done
          # restamp regardless: the cards that did succeed may have changed
          python3 scripts/bust_cache.py || failed="$failed bust_cache"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets README.md; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets README.md
          git commit -m 'Update profile cards'
          git push

      - name: Fail if any generator failed
        if: steps.generate.outputs.failed != ''
        run: |
          echo "::error::generators failed:${{ steps.generate.outputs.failed }}"
          exit 1
